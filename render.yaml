services:
  - type: web
    name: hydrocloud-goes-service
    env: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/status
    envVars:
      - key: TZ
        value: UTC
      - key: DB_BACKEND
        value: oracle
      - key: ORACLE_USER
        value: MYCLOUD_TS
      - key: ORACLE_PASSWORD
        sync: false
      - key: ORACLE_DSN
        value: (description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=adb.mx-queretaro-1.oraclecloud.com))(connect_data=(service_name=ga4e34d25e10323_hydroclouddb_high.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))
