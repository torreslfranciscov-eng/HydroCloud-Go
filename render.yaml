services:
  - type: web
    name: hydrocloud-web
    runtime: docker
    rootDir: HydroCloud.Admin
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /Explore/Stations
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        sync: false
